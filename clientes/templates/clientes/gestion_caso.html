{% extends 'clientes/base.html' %}

{% block title %}Gestion de Caso{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h4 class="mb-0"><i class="bi bi-briefcase-fill me-2"></i>Gestion de Caso</h4>
            </div>
            <div class="card-body">
                <!-- Seccion Cliente -->
                <div class="row mb-4">
                    <div class="col-md-8">
                        <div class="card bg-light">
                            <div class="card-body">
                                <h6 class="card-title text-muted mb-3"><i class="bi bi-person-fill me-1"></i>Datos del Cliente</h6>
                                <div class="row">
                                    <div class="col-md-4 mb-2">
                                        <label for="nomcliente" class="form-label">Nombre</label>
                                        <input type="text" class="form-control" id="nomcliente" placeholder="Nombre">
                                    </div>
                                    <div class="col-md-4 mb-2">
                                        <label for="apellcliente" class="form-label">Apellido</label>
                                        <input type="text" class="form-control" id="apellcliente" placeholder="Apellido">
                                    </div>
                                    <div class="col-md-2 mb-2 d-flex align-items-end">
                                        <button type="button" class="btn btn-primary w-100" onclick="buscarClientePorNombre()" title="Buscar cliente">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                    <div class="col-md-2 mb-2 d-flex align-items-end">
                                        <a href="{% url 'clientes:registro_cliente' %}" class="btn btn-outline-success w-100" id="btnCrearCliente" title="Crear nuevo cliente">
                                            <i class="bi bi-person-plus"></i>
                                        </a>
                                    </div>
                                </div>
                                <div class="row mt-2">
                                    <div class="col-md-6">
                                        <label for="ndocumento" class="form-label">Documento</label>
                                        <input type="text" class="form-control" id="ndocumento" readonly placeholder="No. Documento">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="codcliente" class="form-label">Codigo Cliente</label>
                                        <input type="text" class="form-control" id="codcliente" readonly placeholder="Codigo">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4 d-flex align-items-center justify-content-center">
                        <div class="text-center text-muted" id="clienteStatus">
                            <i class="bi bi-person-x-fill" style="font-size: 3rem;"></i>
                            <p class="mt-2">Busque un cliente</p>
                        </div>
                    </div>
                </div>

                <hr>

                <!-- Seccion Caso -->
                <div class="row">
                    <!-- Columna Izquierda: Datos del Caso -->
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-body">
                                <h6 class="card-title text-muted mb-3"><i class="bi bi-briefcase me-1"></i>Datos del Caso</h6>
                                
                                <!-- No Caso con boton Crear -->
                                <div class="row mb-3">
                                    <div class="col-8">
                                        <label for="nocaso" class="form-label">No. Caso</label>
                                        <select class="form-select" id="nocaso" onchange="cargarDatosCaso()" disabled>
                                            <option value="">-- Sin casos --</option>
                                        </select>
                                    </div>
                                    <div class="col-4 d-flex align-items-end">
                                        <button type="button" class="btn btn-success w-100" id="btnCrearCaso" onclick="crearNuevoCaso()" disabled>
                                            <i class="bi bi-plus-circle"></i> Crear
                                        </button>
                                    </div>
                                </div>

                                <!-- Fecha Inicio -->
                                <div class="mb-3">
                                    <label for="fechainicio" class="form-label">Fecha Inicio</label>
                                    <input type="date" class="form-control" id="fechainicio" disabled>
                                </div>

                                <!-- Fecha Fin -->
                                <div class="mb-3">
                                    <label for="fechafin" class="form-label">Fecha Fin</label>
                                    <input type="date" class="form-control" id="fechafin" readonly placeholder="NULL hasta ultimo pago">
                                </div>

                                <!-- Especializacion -->
                                <div class="mb-3">
                                    <label for="codespecializacion" class="form-label">Especializacion</label>
                                    <select class="form-select" id="codespecializacion" disabled>
                                        <option value="">-- Seleccione --</option>
                                        {% for esp in especializaciones %}
                                        <option value="{{ esp.0 }}">{{ esp.1 }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <!-- Valor -->
                                <div class="mb-3">
                                    <label for="valor" class="form-label">Valor</label>
                                    <input type="text" class="form-control" id="valor" placeholder="Valor del caso" disabled>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Columna Derecha: Casos del cliente y acciones -->
                    <div class="col-md-6">
                        <div class="card mb-3">
                            <div class="card-body">
                                <h6 class="card-title text-muted mb-3"><i class="bi bi-list-ul me-1"></i>Casos del Cliente</h6>
                                <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                                    <table class="table table-sm table-hover" id="tablaCasosActivos">
                                        <thead class="table-light">
                                            <tr>
                                                <th>No.</th>
                                                <th>Especializ.</th>
                                                <th>Estado</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td colspan="3" class="text-center text-muted">Sin datos</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Botones de Accion -->
                        <div class="card">
                            <div class="card-body">
                                <div class="d-grid gap-2">
                                    <button type="button" class="btn btn-secondary" id="btnAcuerdoPago" disabled>
                                        <i class="bi bi-cash-stack"></i> Acuerdo Pago
                                    </button>
                                    <button type="button" class="btn btn-success btn-lg" id="btnGuardar" onclick="guardarCaso()" disabled>
                                        <i class="bi bi-check-circle"></i> Guardar
                                    </button>
                                    <button type="button" class="btn btn-warning" onclick="limpiarTodo()">
                                        <i class="bi bi-eraser"></i> Limpiar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let clienteActual = null;
    let modoNuevoCaso = false;
    let casoSeleccionado = null;

    function buscarClientePorNombre() {
        const nombre = document.getElementById('nomcliente').value.trim();
        const apellido = document.getElementById('apellcliente').value.trim();
        
        if (!nombre || !apellido) {
            mostrarAlerta('Ingrese nombre y apellido del cliente', 'warning');
            return;
        }

        fetch("{% url 'clientes:buscar_cliente_caso' %}?nombre=" + encodeURIComponent(nombre) + "&apellido=" + encodeURIComponent(apellido))
            .then(response => response.json())
            .then(data => {
                if (data.encontrado) {
                    clienteActual = data.cliente;
                    // Mostrar documento del cliente encontrado
                    document.getElementById('ndocumento').value = data.cliente.ndocumento || '';
                    document.getElementById('codcliente').value = data.cliente.codcliente || '';
                    
                    document.getElementById('clienteStatus').innerHTML = 
                        '<i class="bi bi-person-check-fill text-success" style="font-size: 3rem;"></i>' +
                        '<p class="mt-2 text-success">Cliente encontrado</p>';
                    
                    // Habilitar boton crear caso
                    document.getElementById('btnCrearCaso').disabled = false;
                    
                    mostrarAlerta('Cliente encontrado: ' + data.cliente.nomcliente + ' ' + data.cliente.apellcliente, 'success');
                    // Cargar casos del cliente
                    cargarCasosCliente(data.cliente.codcliente);
                } else {
                    clienteActual = null;
                    document.getElementById('ndocumento').value = '';
                    document.getElementById('codcliente').value = '';
                    document.getElementById('clienteStatus').innerHTML = 
                        '<i class="bi bi-person-x-fill text-danger" style="font-size: 3rem;"></i>' +
                        '<p class="mt-2 text-danger">Cliente no encontrado</p>' +
                        '<small class="text-muted">Use el boton + para crearlo</small>';
                    document.getElementById('btnCrearCaso').disabled = true;
                    limpiarCamposCaso();
                    mostrarAlerta('Cliente no encontrado. Puede crearlo con el boton +', 'warning');
                }
            })
            .catch(error => {
                mostrarAlerta('Error al buscar: ' + error, 'danger');
            });
    }

    function cargarCasosCliente(codcliente) {
        fetch("{% url 'clientes:obtener_casos_cliente' %}?codcliente=" + encodeURIComponent(codcliente))
            .then(response => response.json())
            .then(data => {
                const selectCaso = document.getElementById('nocaso');
                const tbody = document.getElementById('tablaCasosActivos').getElementsByTagName('tbody')[0];
                
                if (data.casos && data.casos.length > 0) {
                    // Filtrar casos ACTIVOS (sin fecha fin)
                    let casosActivos = data.casos.filter(c => c.estadocaso === 'ACTIVO');
                    
                    // Llenar el select con TODOS los casos
                    selectCaso.innerHTML = '<option value="">-- Seleccione caso --</option>';
                    data.casos.forEach(caso => {
                        const estado = caso.estadocaso === 'ACTIVO' ? '(Activo)' : '(Cerrado)';
                        selectCaso.innerHTML += '<option value="' + caso.idcaso + '">' + caso.idcaso + ' - ' + caso.tipocaso + ' ' + estado + '</option>';
                    });
                    selectCaso.disabled = false;
                    
                    // Llenar tabla con todos los casos
                    tbody.innerHTML = data.casos.map(caso => 
                        '<tr onclick="seleccionarCasoTabla(' + caso.idcaso + ')" style="cursor:pointer;" class="' + (caso.estadocaso === 'ACTIVO' ? 'table-success' : '') + '">' +
                            '<td>' + caso.idcaso + '</td>' +
                            '<td>' + (caso.tipocaso || '-') + '</td>' +
                            '<td><span class="badge bg-' + (caso.estadocaso === 'ACTIVO' ? 'success' : 'secondary') + '">' + caso.estadocaso + '</span></td>' +
                        '</tr>'
                    ).join('');
                    
                    // AUTOMATICAMENTE seleccionar el ULTIMO caso ACTIVO (sin fecha fin)
                    if (casosActivos.length > 0) {
                        // El ultimo caso activo es el primero en la lista (ordenado por fecha DESC)
                        selectCaso.value = casosActivos[0].idcaso;
                        cargarDatosCaso();
                        mostrarAlerta('Se cargo el ultimo caso activo del cliente', 'info');
                    } else {
                        mostrarAlerta('El cliente no tiene casos activos. Puede crear uno nuevo.', 'info');
                    }
                } else {
                    selectCaso.innerHTML = '<option value="">-- Sin casos --</option>';
                    selectCaso.disabled = true;
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Sin casos registrados</td></tr>';
                    mostrarAlerta('Cliente sin casos. Puede crear uno nuevo.', 'info');
                }
            })
            .catch(error => {
                mostrarAlerta('Error al cargar casos: ' + error, 'danger');
            });
    }

    function seleccionarCasoTabla(nocaso) {
        document.getElementById('nocaso').value = nocaso;
        cargarDatosCaso();
    }

    function cargarDatosCaso() {
        const nocaso = document.getElementById('nocaso').value;
        if (!nocaso || nocaso === 'nuevo') {
            return;
        }

        // Al cargar un caso existente, es SOLO CONSULTA
        fetch("{% url 'clientes:obtener_detalle_caso' %}?nocaso=" + encodeURIComponent(nocaso))
            .then(response => response.json())
            .then(data => {
                if (data.encontrado) {
                    casoSeleccionado = data.caso;
                    modoNuevoCaso = false;
                    
                    // Llenar campos con datos del caso - SOLO LECTURA
                    document.getElementById('fechainicio').value = data.caso.fechainicio || '';
                    document.getElementById('fechafin').value = data.caso.fechafin || '';
                    document.getElementById('codespecializacion').value = data.caso.codespecializacion || '';
                    document.getElementById('valor').value = data.caso.valor || '';
                    
                    // TODOS los campos DESHABILITADOS - caso existente es solo consulta
                    document.getElementById('fechainicio').disabled = true;
                    document.getElementById('codespecializacion').disabled = true;
                    document.getElementById('valor').disabled = true;
                    
                    // El boton guardar DESHABILITADO para casos existentes
                    document.getElementById('btnGuardar').disabled = true;
                    
                    // Acuerdo pago disponible solo para casos activos
                    const esActivo = !data.caso.fechafin;
                    document.getElementById('btnAcuerdoPago').disabled = !esActivo;
                    
                    mostrarAlerta('Caso cargado (solo consulta)', 'info');
                }
            })
            .catch(error => {
                mostrarAlerta('Error al cargar caso: ' + error, 'danger');
            });
    }

    function crearNuevoCaso() {
        if (!clienteActual) {
            mostrarAlerta('Primero busque un cliente', 'warning');
            return;
        }
        
        modoNuevoCaso = true;
        casoSeleccionado = null;
        
        // Cambiar select a modo "NUEVO"
        document.getElementById('nocaso').innerHTML = '<option value="nuevo">NUEVO (Se generara automaticamente)</option>';
        document.getElementById('nocaso').value = 'nuevo';
        document.getElementById('nocaso').disabled = true;
        
        // Fecha inicio = hoy, HABILITADA para edicion
        document.getElementById('fechainicio').value = new Date().toISOString().split('T')[0];
        document.getElementById('fechainicio').disabled = false;
        
        // Fecha Fin = NULL (vacio) - No se modifica hasta ultimo pago
        document.getElementById('fechafin').value = '';
        
        // Especializacion HABILITADA
        document.getElementById('codespecializacion').value = '';
        document.getElementById('codespecializacion').disabled = false;
        
        // Valor HABILITADO
        document.getElementById('valor').value = '';
        document.getElementById('valor').disabled = false;
        
        // Boton Guardar HABILITADO
        document.getElementById('btnGuardar').disabled = false;
        
        // Acuerdo pago no disponible aun
        document.getElementById('btnAcuerdoPago').disabled = true;
        
        mostrarAlerta('Complete los datos del nuevo caso. El numero se generara automaticamente.', 'info');
    }

    function guardarCaso() {
        if (!clienteActual) {
            mostrarAlerta('No hay cliente seleccionado', 'warning');
            return;
        }
        
        // Solo se puede guardar si es un caso NUEVO
        if (!modoNuevoCaso) {
            mostrarAlerta('Los casos existentes son solo consulta. No se pueden modificar.', 'warning');
            return;
        }
        
        const codespecializacion = document.getElementById('codespecializacion').value;
        const fechainicio = document.getElementById('fechainicio').value;
        const valor = document.getElementById('valor').value.trim();
        
        if (!codespecializacion) {
            mostrarAlerta('Seleccione una especializacion', 'warning');
            return;
        }
        
        if (!fechainicio) {
            mostrarAlerta('Ingrese la fecha de inicio', 'warning');
            return;
        }
        
        if (!valor) {
            mostrarAlerta('Ingrese el valor del caso', 'warning');
            return;
        }

        const formData = {
            codcliente: clienteActual.codcliente,
            idtipocaso: codespecializacion,
            fechainicio: fechainicio,
            desccaso: valor
        };

        fetch("{% url 'clientes:crear_caso' %}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.exito) {
                mostrarAlerta('Caso creado exitosamente. No. Caso: ' + data.nocaso, 'success');
                modoNuevoCaso = false;
                // Recargar lista de casos del cliente
                cargarCasosCliente(clienteActual.codcliente);
            } else {
                mostrarAlerta(data.mensaje || 'Error al guardar caso', 'danger');
            }
        })
        .catch(error => {
            mostrarAlerta('Error: ' + error, 'danger');
        });
    }

    function limpiarCamposCaso() {
        document.getElementById('nocaso').innerHTML = '<option value="">-- Sin casos --</option>';
        document.getElementById('nocaso').disabled = true;
        document.getElementById('fechainicio').value = '';
        document.getElementById('fechainicio').disabled = true;
        document.getElementById('fechafin').value = '';
        document.getElementById('codespecializacion').value = '';
        document.getElementById('codespecializacion').disabled = true;
        document.getElementById('valor').value = '';
        document.getElementById('valor').disabled = true;
        document.getElementById('btnGuardar').disabled = true;
        document.getElementById('btnAcuerdoPago').disabled = true;
        document.getElementById('tablaCasosActivos').getElementsByTagName('tbody')[0].innerHTML = 
            '<tr><td colspan="3" class="text-center text-muted">Sin datos</td></tr>';
        modoNuevoCaso = false;
        casoSeleccionado = null;
    }

    function limpiarTodo() {
        clienteActual = null;
        document.getElementById('nomcliente').value = '';
        document.getElementById('apellcliente').value = '';
        document.getElementById('ndocumento').value = '';
        document.getElementById('codcliente').value = '';
        document.getElementById('clienteStatus').innerHTML = 
            '<i class="bi bi-person-x-fill" style="font-size: 3rem;"></i>' +
            '<p class="mt-2">Busque un cliente</p>';
        document.getElementById('btnCrearCaso').disabled = true;
        limpiarCamposCaso();
    }
</script>
{% endblock %}
